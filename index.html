<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中华历史时间轴</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="历史时间轴">
<style>
:root {
  --bg-primary: #0a0a14;
  --bg-secondary: #12122a;
  --bg-card: rgba(18, 18, 42, 0.94);
  --text-primary: #e8e0d0;
  --text-secondary: #a89b8c;
  --text-muted: #5a5248;
  --gold: #c9a96e;
  --gold-light: #dbb87a;
  --gold-dark: #8a6d3b;
  --border-gold: rgba(201, 169, 110, 0.25);
  --glow-gold: rgba(201, 169, 110, 0.15);
  --cat-politics: #e74c3c;
  --cat-science: #3498db;
  --cat-person: #f39c12;
  --cat-society: #2ecc71;
  --cat-culture: #9b59b6;
  --cat-military: #e67e22;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-primary);color:var(--text-primary);font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;overflow:hidden;height:100vh;width:100vw;-webkit-user-select:none;user-select:none}

.loading-screen{position:fixed;inset:0;background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.5s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border-gold);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--gold);font-size:13px;margin-top:12px;letter-spacing:2px;opacity:0.7}

.starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:0.2}100%{opacity:0.8}}

/* ===== Dynasty Nav Bar ===== */
.dynasty-nav{position:fixed;top:46px;left:0;right:0;height:28px;background:linear-gradient(180deg,rgba(10,10,20,0.97) 0%,rgba(10,10,20,0.85) 80%,transparent 100%);display:flex;align-items:center;gap:0;padding:0 4px;z-index:99;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none}
.dynasty-nav::-webkit-scrollbar{display:none}
.dynasty-nav-item{font-size:10px;padding:3px 7px;color:var(--text-muted);cursor:pointer;border-radius:4px;white-space:nowrap;transition:all 0.2s;flex-shrink:0;border:1px solid transparent;letter-spacing:1px}
.dynasty-nav-item:hover{color:var(--text-secondary);background:rgba(201,169,110,0.06)}
.dynasty-nav-item.focus{color:var(--gold);border-color:var(--border-gold);background:rgba(201,169,110,0.08)}

.header{position:fixed;top:0;left:0;right:0;height:46px;background:linear-gradient(180deg,rgba(10,10,20,0.97) 0%,rgba(10,10,20,0.8) 80%,transparent 100%);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100}
.header-title{font-size:14px;color:var(--gold);letter-spacing:3px;font-weight:300;white-space:nowrap}
.search-box{flex:1;max-width:240px;position:relative}
.search-input{width:100%;background:rgba(201,169,110,0.06);border:1px solid var(--border-gold);border-radius:14px;padding:4px 10px 4px 26px;color:var(--text-primary);font-size:11px;outline:none;transition:border-color 0.2s}
.search-input::placeholder{color:var(--text-muted)}
.search-input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-muted);pointer-events:none}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--bg-secondary);border:1px solid var(--border-gold);border-radius:8px;margin-top:4px;max-height:260px;overflow-y:auto;display:none;z-index:150}
.search-results.active{display:block}
.search-item{padding:7px 10px;cursor:pointer;border-bottom:1px solid rgba(201,169,110,0.08);font-size:11px;display:flex;align-items:center;gap:6px}
.search-item:hover{background:rgba(201,169,110,0.06)}
.search-item .si-year{color:var(--gold);font-size:9px;min-width:50px}
.search-item .si-title{color:var(--text-primary);flex:1}
.search-item .si-cat{font-size:8px;padding:0 4px;border-radius:2px}
.header-btns{display:flex;gap:5px}
.btn{background:rgba(201,169,110,0.08);border:1px solid var(--border-gold);color:var(--gold);padding:4px 9px;border-radius:4px;font-size:11px;cursor:pointer;transition:background 0.2s;white-space:nowrap}
.btn:hover{background:rgba(201,169,110,0.2)}

.btn-home{position:fixed;right:10px;top:54px;background:rgba(10,10,20,0.88);border:1px solid var(--border-gold);color:var(--gold);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;transition:all 0.2s;opacity:0.6}
.btn-home:hover{background:rgba(201,169,110,0.15);opacity:1;transform:scale(1.1)}

/* 密度控制 */
.density-control{position:fixed;right:10px;bottom:50px;background:rgba(10,10,20,0.92);border:1px solid var(--border-gold);border-radius:8px;padding:6px 10px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:2px}
.density-label{font-size:8px;color:var(--text-muted);white-space:nowrap}
.density-value{font-size:9px;color:var(--gold)}
.density-slider{width:60px;-webkit-appearance:none;appearance:none;height:3px;background:var(--border-gold);border-radius:2px;outline:none}
.density-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--gold);border-radius:50%;cursor:pointer}
.density-slider::-moz-range-thumb{width:12px;height:12px;background:var(--gold);border-radius:50%;cursor:pointer;border:none}

/* ===== Focus Indicator ===== */
.focus-indicator{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:rgba(10,10,20,0.92);border:1px solid var(--border-gold);border-radius:12px;padding:2px 14px;font-size:11px;color:var(--gold);z-index:99;pointer-events:none;transition:opacity 0.3s;letter-spacing:2px;white-space:nowrap;display:flex;align-items:center}

.filter-bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(10,10,20,0.92);border:1px solid var(--border-gold);border-radius:16px;padding:3px 8px;z-index:100}
.filter-chip{font-size:9px;padding:2px 7px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all 0.2s;white-space:nowrap}
.filter-chip.active{border-color:currentColor}
.filter-chip[data-cat="all"]{color:var(--gold)}
.filter-chip[data-cat="政治"]{color:var(--cat-politics)}
.filter-chip[data-cat="科技"]{color:var(--cat-science)}
.filter-chip[data-cat="人物"]{color:var(--cat-person)}
.filter-chip[data-cat="社会"]{color:var(--cat-society)}
.filter-chip[data-cat="文化"]{color:var(--cat-culture)}
.filter-chip[data-cat="军事"]{color:var(--cat-military)}

.scale-bar{position:fixed;bottom:40px;left:14px;z-index:100;pointer-events:none}
.scale-line{height:2px;background:var(--gold);opacity:0.5;position:relative;border-radius:1px}
.scale-line::before,.scale-line::after{content:'';position:absolute;width:1px;height:5px;background:var(--gold);opacity:0.5;top:-1.5px}
.scale-line::before{left:0}
.scale-line::after{right:0}
.scale-label{font-size:8px;color:var(--text-muted);margin-top:2px;text-align:center}

.zoom-indicator{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(10,10,20,0.9);border:1px solid var(--border-gold);border-radius:12px;padding:2px 10px;font-size:9px;color:var(--gold);z-index:100;pointer-events:none;opacity:0;transition:opacity 0.3s}
.zoom-indicator.show{opacity:1}

.timeline-viewport{width:100vw;height:100vh;overflow:hidden;position:relative;z-index:1}
.timeline-canvas{position:absolute;top:0;left:0;width:100%;height:100%}

.timeline-line{position:absolute;top:50%;height:2px;transform:translateY(-1px);pointer-events:none;background:linear-gradient(90deg,transparent 0%,var(--gold-dark) 3%,var(--gold) 20%,var(--gold-light) 50%,var(--gold) 80%,var(--gold-dark) 97%,transparent 100%);box-shadow:0 0 8px var(--glow-gold),0 0 20px rgba(201,169,110,0.05)}

/* ===== Dynasty Bands (v1.4 staggered rows for overlap) ===== */
.dynasty-band{position:absolute;pointer-events:none;transition:opacity 0.4s}
.dynasty-band-upper{border-radius:3px 3px 0 0}
.dynasty-band-lower{border-radius:0 0 3px 3px}
.dynasty-label{position:absolute;text-align:center;pointer-events:none;transition:opacity 0.3s}
.dynasty-label span{font-size:10px;color:var(--gold);letter-spacing:3px;white-space:nowrap;font-weight:300;transition:all 0.3s}
.dynasty-label.focus span{font-size:13px;font-weight:500;letter-spacing:4px}
.dynasty-label .dynasty-years{display:block;font-size:8px;color:var(--text-muted);letter-spacing:1px;font-weight:300;margin-top:1px;opacity:0.7}
.dynasty-label.focus .dynasty-years{font-size:9px;opacity:0.85}
.dynasty-divider{position:absolute;width:1px;transform:translateX(-50%);z-index:2;transition:opacity 0.3s}
/* Overlap dynasty staggered rows */
.dynasty-row{position:absolute;pointer-events:none;display:flex;align-items:center}
.dynasty-row-label{position:absolute;white-space:nowrap;font-size:8px;color:var(--text-muted);letter-spacing:1px;pointer-events:none;opacity:0.5}
.dynasty-row-label.focus{color:var(--gold);opacity:1;font-size:10px;letter-spacing:2px}
/* Population curve */
.pop-curve-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.pop-curve{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:0.35;transition:opacity 0.3s}
.pop-curve-area{opacity:0.06;transition:opacity 0.3s}
.pop-dot{fill:var(--gold);stroke:var(--gold);stroke-width:1;opacity:0.6;transition:opacity 0.3s,r 0.2s}
.pop-dot-glow{fill:none;stroke:var(--gold);stroke-width:0.5;opacity:0.2}
.pop-label{font-size:9px;fill:var(--gold);opacity:0.5;pointer-events:none;font-family:inherit}

.tick{position:absolute;pointer-events:none}
.tick-line{width:1px;position:absolute;left:0}
.tick-label{position:absolute;font-size:8px;color:var(--text-muted);white-space:nowrap;transform:translateX(-50%)}
.tick.major .tick-line{background:rgba(201,169,110,0.25)}
.tick.major .tick-label{font-size:9px;color:var(--text-secondary)}
.tick.minor .tick-line{background:rgba(201,169,110,0.08)}

.event-node{position:absolute;cursor:pointer;z-index:3;will-change:transform;transition:opacity 0.3s}
.event-node.active{z-index:50}
@media(hover:hover){
  .event-node:hover{z-index:45}
  .event-node:hover .event-card{border-color:var(--gold);box-shadow:0 0 12px rgba(201,169,110,0.1),0 4px 12px rgba(0,0,0,0.3)}
}
.event-dot{position:absolute;left:50%;transform:translate(-50%,-50%);border-radius:50%;z-index:5;transition:transform 0.15s,box-shadow 0.15s}
.event-dot.level-1{width:12px;height:12px;box-shadow:0 0 8px currentColor,0 0 16px rgba(201,169,110,0.1)}
.event-dot.level-2{width:8px;height:8px;box-shadow:0 0 5px currentColor}
.event-dot.level-3{width:5px;height:5px;box-shadow:0 0 3px currentColor;opacity:0.8}
.event-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;opacity:0;animation:dotPulse 2.5s ease-in-out infinite}
.event-dot.level-1::after{opacity:0.2}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:0.2}50%{transform:scale(1.6);opacity:0}}

.event-stem{position:absolute;width:1px;left:50%;transform:translateX(-50%);z-index:1;opacity:0.3}
.event-stem.above{bottom:50%}
.event-stem.below{top:50%}

.event-card{position:absolute;left:50%;transform:translateX(-50%);padding:5px 10px 5px 13px;background:var(--bg-card);border:1px solid var(--border-gold);border-radius:6px;cursor:pointer;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);z-index:3;min-width:130px;max-width:180px;backdrop-filter:blur(4px)}
.event-card:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(201,169,110,0.1),0 4px 12px rgba(0,0,0,0.3);transform:translateX(-50%) translateY(-2px)}
.event-card.expanded{background:var(--bg-secondary);border-color:var(--gold);max-width:280px;z-index:10;box-shadow:0 0 16px rgba(201,169,110,0.12),0 8px 24px rgba(0,0,0,0.4);transform:translateX(-50%) translateY(-2px)}
.event-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:6px 0 0 6px;background:var(--card-cat-color,var(--gold))}
.cat-politics{--card-cat-color:var(--cat-politics)}.cat-science{--card-cat-color:var(--cat-science)}.cat-person{--card-cat-color:var(--cat-person)}.cat-society{--card-cat-color:var(--cat-society)}.cat-culture{--card-cat-color:var(--cat-culture)}.cat-military{--card-cat-color:var(--cat-military)}
.event-card-inner{display:flex;flex-direction:column;gap:1px}
.event-card-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.event-year{font-size:9px;color:var(--gold);white-space:nowrap;min-width:52px}
.event-title{font-size:11px;color:var(--text-primary);line-height:1.3;font-weight:500;flex:1}
.event-cat-tag{font-size:8px;padding:0 4px;border-radius:2px;flex-shrink:0;opacity:0.65}
.event-dynasty{font-size:8px;color:var(--text-muted);white-space:nowrap}
.event-summary{font-size:10px;color:var(--text-secondary);line-height:1.4;margin-top:4px;display:none}
.event-card.expanded .event-summary{display:block}
.event-detail-btn{font-size:9px;color:var(--gold);margin-top:3px;display:none}
.event-card.expanded .event-detail-btn{display:block}
.event-card.important{border-color:rgba(201,169,110,0.4)}
.event-card.important .event-title{font-weight:600}

.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.78);z-index:200;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.detail-overlay.active{display:flex}
.detail-panel{background:var(--bg-secondary);border:1px solid var(--border-gold);border-radius:12px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;padding:18px;box-shadow:0 0 30px rgba(201,169,110,0.08)}
.detail-close{float:right;background:none;border:none;color:var(--text-secondary);font-size:16px;cursor:pointer;padding:0 2px}
.detail-close:hover{color:var(--gold)}
.detail-year{font-size:12px;color:var(--gold);margin-bottom:3px;letter-spacing:1px}
.detail-title{font-size:19px;color:var(--text-primary);font-weight:600;line-height:1.3}
.detail-tags{display:flex;gap:5px;margin:6px 0 10px;flex-wrap:wrap}
.detail-tag{font-size:9px;padding:2px 7px;border-radius:6px;border:1px solid}
.detail-image-placeholder{width:100%;height:120px;background:var(--bg-primary);border:1px dashed var(--border-gold);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:11px;margin-bottom:12px}
.detail-desc{font-size:13px;color:var(--text-primary);line-height:1.85;opacity:0.9}
.detail-context{margin-top:12px;padding-top:10px;border-top:1px solid var(--border-gold);font-size:11px;color:var(--text-secondary);line-height:1.6}
.detail-context h4{color:var(--gold);font-size:11px;margin-bottom:3px;font-weight:500}

/* Feedback Button & Modal */
.side-btn{position:fixed;right:10px;width:34px;height:34px;background:rgba(10,10,20,0.92);border:1px solid var(--border-gold);border-radius:50%;color:var(--gold);font-size:14px;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;transition:all 0.2s;opacity:0.7;line-height:1}
.side-btn:hover{background:rgba(201,169,110,0.15);opacity:1;transform:scale(1.1)}
.feedback-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:300;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.feedback-overlay.active{display:flex}
.feedback-panel{background:var(--bg-secondary);border:1px solid var(--border-gold);border-radius:12px;max-width:420px;width:100%;padding:20px;box-shadow:0 0 30px rgba(201,169,110,0.08)}
.feedback-title{font-size:16px;color:var(--gold);font-weight:500;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.feedback-close{background:none;border:none;color:var(--text-secondary);font-size:16px;cursor:pointer;padding:0 2px}
.feedback-close:hover{color:var(--gold)}
.feedback-group{margin-bottom:12px}
.feedback-group label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.feedback-group textarea{width:100%;height:100px;background:var(--bg-primary);border:1px solid var(--border-gold);border-radius:8px;padding:8px 10px;color:var(--text-primary);font-size:13px;resize:vertical;outline:none;font-family:inherit;line-height:1.5}
.feedback-group textarea::placeholder{color:var(--text-muted)}
.feedback-group textarea:focus{border-color:var(--gold)}
.feedback-group input{width:100%;background:var(--bg-primary);border:1px solid var(--border-gold);border-radius:8px;padding:7px 10px;color:var(--text-primary);font-size:12px;outline:none;font-family:inherit}
.feedback-group input::placeholder{color:var(--text-muted)}
.feedback-group input:focus{border-color:var(--gold)}
.feedback-hint{font-size:9px;color:var(--text-muted);margin-top:3px}
.feedback-submit{width:100%;padding:8px;background:linear-gradient(135deg,var(--gold-dark),var(--gold));border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;transition:opacity 0.2s;font-weight:500}
.feedback-submit:hover{opacity:0.9}
.feedback-submit:disabled{opacity:0.4;cursor:not-allowed}
.feedback-success{text-align:center;padding:20px 0;color:var(--gold);font-size:14px}
.feedback-success .check{font-size:32px;margin-bottom:8px}

@media(orientation:landscape) and (max-height:500px){
  .header{height:38px;padding:0 8px}
  .header-title{font-size:12px;letter-spacing:2px}
  .search-input{font-size:10px;padding:3px 8px 3px 22px}
  .btn-home{top:44px;width:30px;height:30px;font-size:13px}
  .dynasty-nav{top:38px;height:24px}
  .focus-indicator{top:66px;font-size:10px}
  .filter-bar{bottom:6px;padding:2px 5px}
  .filter-chip{font-size:8px;padding:1px 5px}
  .scale-bar{bottom:28px}
  .density-control{bottom:6px;right:8px}
  .side-btn{width:30px;height:30px;font-size:12px;right:8px}
  .side-btn[style*="bottom:60px"]{bottom:48px}
  .side-btn[style*="bottom:100px"]{bottom:84px}
  .side-btn[style*="bottom:140px"]{bottom:120px}
  .event-card{max-width:200px}
  .event-card.expanded{max-width:300px}
  .dynasty-label span{font-size:9px}
}
@media(min-width:768px){
  .event-card{max-width:200px}
  .event-card.expanded{max-width:300px}
}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">加载历史数据...</div>
</div>

<div class="starfield" id="starfield"></div>

<div class="header">
  <span class="header-title">中华历史时间轴</span>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="搜索事件、人物、朝代..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="header-btns">
    <button class="btn" onclick="toggleFullscreen()">全屏</button>
  </div>
</div>

<!-- Dynasty Quick Nav Bar -->
<div class="dynasty-nav" id="dynastyNav"></div>

<div class="focus-indicator" id="focusIndicator"></div>

<button class="btn-home" id="btnHome" onclick="goHome()" title="回到当前位置">⌂</button>

<div class="density-control" style="bottom:12px">
  <span class="density-label">密度</span>
  <input type="range" class="density-slider" id="densitySlider" min="0.3" max="3" step="0.1" value="1">
  <span class="density-value" id="densityValue">1.0x</span>
</div>

<button class="side-btn" id="popToggle" title="人口曲线" style="bottom:60px">📈</button>

<div class="timeline-viewport" id="viewport">
  <div class="timeline-canvas" id="canvas"></div>
</div>

<div class="scale-bar" id="scaleBar">
  <div class="scale-line" id="scaleLine"></div>
  <div class="scale-label" id="scaleLabel"></div>
</div>

<div class="zoom-indicator" id="zoomIndicator"></div>

<div class="filter-bar" id="filterBar">
  <div class="filter-chip active" data-cat="all">全部</div>
  <div class="filter-chip active" data-cat="政治">政治</div>
  <div class="filter-chip active" data-cat="军事">军事</div>
  <div class="filter-chip active" data-cat="科技">科技</div>
  <div class="filter-chip active" data-cat="文化">文化</div>

// ============ Historical Population Data (万人) ============
// Based on scholarly estimates: 葛剑雄《中国人口史》、官方人口普查数据
// unit: 万
const POP_DATA = [
  {year:-2070,pop:1300},{year:-1600,pop:1500},{year:-1046,pop:2000},{year:-770,pop:2000},
  {year:-684,pop:1185},{year:-400,pop:2800},{year:-221,pop:2000},{year:-202,pop:1500},
  {year:2,pop:5767},{year:57,pop:2100},{year:157,pop:5648},{year:220,pop:2500},
  {year:280,pop:2400},{year:520,pop:5000},{year:609,pop:4600},{year:755,pop:8500},
  {year:960,pop:5000},{year:1120,pop:12000},{year:1200,pop:11500},{year:1290,pop:6000},
  {year:1393,pop:6200},{year:1600,pop:18000},{year:1644,pop:15000},{year:1680,pop:10000},
  {year:1741,pop:14300},{year:1790,pop:30100},{year:1834,pop:40100},{year:1851,pop:43000},
  {year:1870,pop:35000},{year:1910,pop:43000},{year:1930,pop:48000},{year:1949,pop:54000},
  {year:1953,pop:60200},{year:1964,pop:72300},{year:1982,pop:103200},{year:1990,pop:114000},
  {year:2000,pop:126700},{year:2010,pop:134100},{year:2020,pop:141200},{year:2025,pop:140500}
];
const POP_MAX = 150000;

// Interpolate population at any year
function getPopAtYear(y) {
  if (y <= POP_DATA[0].year) return POP_DATA[0].pop;
  if (y >= POP_DATA[POP_DATA.length-1].year) return POP_DATA[POP_DATA.length-1].pop;
  for (let i = 1; i < POP_DATA.length; i++) {
    if (y <= POP_DATA[i].year) {
      const p = POP_DATA[i-1], c = POP_DATA[i];
      const t = (y - p.year) / (c.year - p.year);
      return p.pop + t * (c.pop - p.pop);
    }
  }
  return POP_DATA[POP_DATA.length-1].pop;
}

// Find the most relevant dynasty for a given year
// Non-overlap (main) dynasties take priority; among overlap dynasties, smallest span wins
// For boundary years (a dynasty's end = next dynasty's start), prefer the one starting that year
function getDynastyAtYear(y) {
  const covering = dynasties.filter(d => y >= d.start && y <= d.end);
  if (covering.length === 0) {
    if (y < -2070) return '夏';
    if (y > 2026) return '新中国';
    return '';
  }
  // Prefer non-overlap (main) dynasties
  const main = covering.filter(d => !d.overlap);
  if (main.length > 0) {
    // For boundary years, prefer the dynasty that starts at this year (not ends at this year)
    const starting = main.filter(d => d.start === y);
    if (starting.length > 0) return starting[0].name;
    // Otherwise, pick the one with smallest span (most specific)
    main.sort((a, b) => (a.end - a.start) - (b.end - b.start));
    return main[0].name;
  }
  // Only overlap dynasties — pick the one with smallest span (most specific, e.g. 五代十国 over 辽)
  covering.sort((a, b) => (a.end - a.start) - (b.end - b.start));
  return covering[0].name;
}
function getDynastyObj(name) {
  return dynasties.find(d => d.name === name);
}

// Format dynasty year range for display (e.g., "前2070-前1600", "618-907")
function formatDynastyYears(d) {
  const fmtY = y => y < 0 ? '前' + Math.abs(y) : '' + y;
  return fmtY(d.start) + '-' + fmtY(d.end);
}

// Manual focus dynasty - set when user clicks a nav item to override year-based lookup
// Cleared when user starts dragging/scrolling, not on timeout
let manualFocusDynasty = null;
let isAnimating = false; // prevent clearing manualFocusDynasty during animation

function jumpToDynasty(name){

  // Set manual focus so overlap dynasties (辽/金/西夏/五代十国) don't get overridden

// ============ Focus Weight System ============
let currentFocusDynasty = '';

function calculateFocusWeight(eventYear, centerYear) {
  const focusDynasty = currentFocusDynasty || getDynastyAtYear(Math.round(centerYear));
  const eventDynasty = getDynastyAtYear(eventYear);

  if (focusDynasty === eventDynasty) return 1.0;

  // Find distance in dynasty list
  const focusIdx = dynasties.findIndex(d => d.name === focusDynasty);
  const eventIdx = dynasties.findIndex(d => d.name === eventDynasty);

  if (focusIdx < 0 || eventIdx < 0) return 0.4;

  const dist = Math.abs(focusIdx - eventIdx);
  if (dist === 1) return 0.65;
  if (dist === 2) return 0.45;
  return Math.max(0.2, 0.4 - dist * 0.05);
}

function getBandOpacity(dynastyName, centerYear) {
  const focusDynasty = currentFocusDynasty || getDynastyAtYear(Math.round(centerYear));
  if (focusDynasty === dynastyName) return 1.0;

  const focusIdx = dynasties.findIndex(d => d.name === focusDynasty);
  const bandIdx = dynasties.findIndex(d => d.name === dynastyName);
  if (focusIdx < 0 || bandIdx < 0) return 0.3;

  const dist = Math.abs(focusIdx - bandIdx);
  if (dist === 1) return 0.7;
  if (dist === 2) return 0.5;
  return Math.max(0.15, 0.35 - dist * 0.04);
}

// ============ 数据范围 ============
// 固定范围：从夏朝开始到当前年份，不展示之前/之后的无意义区域
const DATA_MIN = -2070;
const DATA_MAX = 2026;

// ============ DOM ============
const viewport=document.getElementById('viewport');

const searchResults=document.getElementById('searchResults');

const scaleLabel=document.getElementById('scaleLabel');

// ============ State ============
let offsetX=0, pixelsPerYear=0.15;
let activeCategories=new Set(["政治","军事","科技","文化","人物","社会"]);
let expandedCard=null;
let touchState='idle', lastPinchTime=0, pinchCurrentDist=0, pinchConfirmed=false;
const PINCH_COOLDOWN=300, PINCH_DEADZONE=10;

// ============ rAF Batching ============
let renderPending=false;
function requestRender(){
  if(!renderPending){renderPending=true;requestAnimationFrame(doRender)}
}
function doRender(){renderPending=false;render()}

// ============ Helpers ============
function getZoomLevel(){if(pixelsPerYear<0.25)return 1;if(pixelsPerYear<1.2)return 2;return 3}
function getZoomLabel(){const l=getZoomLevel();return l===1?'宏观 · 朝代':l===2?'中观 · 年代':'微观 · 日期'}
function yearToX(y){return y*pixelsPerYear+offsetX}
function xToYear(x){return(x-offsetX)/pixelsPerYear}
function clampOffsetX(){
  const vw=viewport.clientWidth,buf=vw*0.15;
  const minOX=buf-DATA_MAX*pixelsPerYear;
  const maxOX=vw-buf-DATA_MIN*pixelsPerYear;
  offsetX=Math.max(minOX,Math.min(maxOX,offsetX));
}
function formatYear(y){return y<0?'前'+Math.abs(y)+'年':y+'年'}
function formatYearFull(e){let s=formatYear(e.year);if(e.month)s+=e.month+'月';if(e.day)s+=e.day+'日';return s}
function getCatColor(c){return CATS[c]?CATS[c].c:'#c9a96e'}
function getCatCSS(c){return CATS[c]?CATS[c].s:''}

// ============ Smart Density with Focus Weight ============
function getMaxVisibleEvents(vw, zl){
  const base = zl===1 ? Math.floor(vw/80) : zl===2 ? Math.floor(vw/50) : Math.floor(vw/35);
  return Math.max(5, Math.floor(base * densityMultiplier));
}

function selectVisibleEvents(visS, visE, vw, centerYear){
  const zl = getZoomLevel();
  const maxEvents = getMaxVisibleEvents(vw, zl);
  const focusDynasty = currentFocusDynasty || getDynastyAtYear(Math.round(centerYear));

  let candidates = events.filter(e=>{
    if(!activeCategories.has(e.category)) return false;
    if(zl < e.level) return false;
    return e.year >= visS && e.year <= visE;
  });

  if(candidates.length <= maxEvents) return candidates;

  // Sort by focus weight first, then level, then year
  candidates.sort((a,b)=>{
    const wa = calculateFocusWeight(a.year, centerYear);
    const wb = calculateFocusWeight(b.year, centerYear);
    if(wa !== wb) return wb - wa; // higher weight first
    if(a.level !== b.level) return a.level - b.level;
    return a.year - b.year;
  });

  // Take events prioritizing focus dynasty (use event's own dynasty field, not year-based lookup)
  const focusEvents = candidates.filter(e => e.dynasty === focusDynasty);
  const nearEvents = candidates.filter(e => e.dynasty !== focusDynasty);

  // All focus dynasty events (respecting level filter)
  const result = [...focusEvents];

  // Fill remaining with nearby dynasty events, spread evenly
  if(result.length < maxEvents && nearEvents.length > 0){
    const remaining = maxEvents - result.length;
    // Sort nearby by distance to focus
    const sorted = [...nearEvents].sort((a,b) => {
      return calculateFocusWeight(a.year, centerYear) > calculateFocusWeight(b.year, centerYear) ? -1 : 1;
    });
    result.push(...spreadPick(sorted, remaining));
  }

  // Re-sort by year for display
  result.sort((a,b) => a.year - b.year);
  return result.slice(0, maxEvents);
}

function spreadPick(arr, n){
  if(n>=arr.length) return arr;
  if(n<=0) return [];
  const result=[];
  for(let i=0;i<n;i++){
    const idx=Math.floor(i*arr.length/n);
    result.push(arr[idx]);
  }
  return result;
}

// ============ Node Pool ============
const nodePool=[];
const activeNodes=new Map();

function getPoolNode(){
  if(nodePool.length>0){const node=nodePool.pop();node.style.display='';return node}
  const node=document.createElement('div');node.className='event-node';
  node.innerHTML='<div class="event-dot"></div><div class="event-stem"></div><div class="event-card"><div class="event-card-inner"><div class="event-card-row"><span class="event-year"></span><span class="event-title"></span></div><div class="event-card-row"><span class="event-cat-tag"></span><span class="event-dynasty"></span></div><div class="event-summary"></div><div class="event-detail-btn">查看详情 →</div></div></div>';
  return node;
}

function returnPoolNode(node){
  node.style.display='none';node.classList.remove('active');node.style.opacity='';
  const card=node.querySelector('.event-card');
  if(card){card.classList.remove('expanded');card.style.cssText=''}
  node.style.transform='';nodePool.push(node);
}

// ============ Card Layout ============
// Category → side mapping: above or below the timeline
// 政治+社会+科技=350 (上) | 军事+人物+文化=376 (下) — 尽量均分
const CAT_SIDE = {"政治":"above","社会":"above","科技":"above","军事":"below","人物":"below","文化":"below"};

function layoutCards(vis,vh,vw){
  const centerY=vh/2, gap=6;
  const above=[],below=[],results=[];
  const sorted=[...vis].sort((a,b)=>a.level!==b.level?a.level-b.level:a.year-b.year);
  sorted.forEach(item=>{
    const x=item.x, estW=item.level===1?145:item.level===2?125:105, cardH=item.level===1?48:40;
    const cL=x-estW/2, cR=x+estW/2;
    // Determine side strictly by category — no fallback to opposite side
    const side = CAT_SIDE[item.event.category] || 'above';
    let placed=false;

    // Place on assigned side only, with more tiers to avoid overflow
    const maxTiers = 8;
    if(side==='above'){
      for(let tier=0;tier<maxTiers;tier++){
        const stem=16+tier*(cardH+8), cB=centerY-4-stem, cT=cB-cardH;let ov=false;
        for(const s of above){if(cL<s.r+gap&&cR>s.l-gap&&cT<s.b&&cB>s.b-s.h){ov=true;break}}
        if(!ov){results.push({...item,pos:'above',stem,tier});above.push({l:cL,r:cR,b:cB,h:cardH});placed=true;break}
      }
    } else {
      for(let tier=0;tier<maxTiers;tier++){
        const stem=16+tier*(cardH+8), cT=centerY+4+stem;let ov=false;
        for(const s of below){if(cL<s.r+gap&&cR>s.l-gap&&cT<s.t+s.h&&cT+cardH>s.t){ov=true;break}}
        if(!ov){results.push({...item,pos:'below',stem,tier});below.push({l:cL,r:cR,t:cT,h:cardH});placed=true;break}
      }
    }
    if(!placed) results.push({...item,pos:side,stem:16,tier:0});
  });
  return results;
}

// ============ Main Render ============
function render(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight, centerY=vh/2;
  const zl=getZoomLevel();
  const visS=xToYear(0), visE=xToYear(vw);
  const centerYear=(visS+visE)/2;

  // Update focus dynasty
  const yearBasedDynasty = getDynastyAtYear(Math.round(centerYear));
  // Use manual focus if set (for overlap dynasties like 辽/金/西夏/五代十国)
  // During animation: always keep manualFocusDynasty (prevent race condition with old viewport position)
  // After animation: clear when user scrolls far away from the focused dynasty
  if (manualFocusDynasty) {
    if (isAnimating) {
      currentFocusDynasty = manualFocusDynasty;
    } else {
      const md = getDynastyObj(manualFocusDynasty);
      if (md && centerYear >= md.start - 30 && centerYear <= md.end + 30) {
        currentFocusDynasty = manualFocusDynasty;
      } else {
        manualFocusDynasty = null; // user has scrolled far away
        currentFocusDynasty = yearBasedDynasty;
      }
    }
  } else {
    currentFocusDynasty = yearBasedDynasty;
  }

  // Update focus indicator with dynasty name + year range
  const focusDynastyObj = getDynastyObj(currentFocusDynasty);
  if (focusDynastyObj) {
    focusIndicator.innerHTML = '<span>' + currentFocusDynasty + '</span><span style="font-size:9px;opacity:0.6;margin-left:6px;letter-spacing:0">' + formatDynastyYears(focusDynastyObj) + '</span>';
    focusIndicator.style.opacity = '1';
  } else {
    focusIndicator.textContent = '';
    focusIndicator.style.opacity = '0';
  }

  // Update dynasty nav highlight
  document.querySelectorAll('.dynasty-nav-item').forEach(el => {
    el.classList.toggle('focus', el.dataset.dynasty === currentFocusDynasty);
  });

  // Auto-scroll dynasty nav to show focused dynasty
  const focusNavEl = dynastyNavEl.querySelector('.dynasty-nav-item.focus');
  if(focusNavEl){
    const navRect = dynastyNavEl.getBoundingClientRect();
    const elRect = focusNavEl.getBoundingClientRect();
    if(elRect.left < navRect.left || elRect.right > navRect.right){
      focusNavEl.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    }
  }

  let html='';

  // --- Background: timeline line ---
  const lL=yearToX(Math.max(visS-100,DATA_MIN)), lR=yearToX(Math.min(visE+100,DATA_MAX));
  if(lR>0&&lL<vw) html+='<div class="timeline-line" style="left:'+Math.max(0,lL)+'px;width:'+(Math.min(vw,lR)-Math.max(0,lL))+'px;top:'+centerY+'px"></div>';

  // --- Background: Dynasty bands (v1.4 staggered rows for overlap dynasties) ---
  const bandH = Math.min(vh * 0.18, 120);
  const rowH = Math.min(bandH * 0.28, 28);
  // Calculate staggered rows: dynasties with overlapping years get different rows
  // Row 0 = center band (main line), Row 1,2,3... = staggered above/below
  // Non-overlap (main) dynasties always get row 0; overlap dynasties get higher rows
  const dynRows = []; // parallel array to dynasties, each item = {row}
  const row0End = []; // tracks occupied ranges on row 0
  const otherRowEnds = {}; // otherRowEnds[row] = end year of last dynasty on that row
  dynasties.forEach((d, i) => {
    if (!d.overlap) {
      // Main dynasty: always row 0
      dynRows[i] = { row: 0 };
      row0End.push(d.end);
    } else {
      // Overlap dynasty: find the lowest row > 0 that doesn't conflict with same-row dynasties
      let row = 1;
      while (otherRowEnds[row] !== undefined && otherRowEnds[row] > d.start) {
        row++;
      }
      dynRows[i] = { row };
      otherRowEnds[row] = d.end;
    }
  });

  // Render all dynasty bands
  dynasties.forEach((d, i) => {
    const x1=yearToX(d.start), x2=yearToX(d.end);
    if(x2<0||x1>vw) return;
    const w = Math.max(x2-x1, 2);
    const bandOpacity = getBandOpacity(d.name, centerYear);
    const isFocus = d.name === currentFocusDynasty;
    const rgb = d.rgb;
    const row = dynRows[i].row;

    if (row === 0) {
      // Main row: draw full upper+lower bands centered on timeline
      const upperAlpha = isFocus ? 0.18 : 0.05 * bandOpacity;
      const lowerAlpha = isFocus ? 0.14 : 0.04 * bandOpacity;
      html+='<div class="dynasty-band dynasty-band-upper" style="left:'+x1+'px;width:'+w+'px;top:'+(centerY-bandH)+'px;height:'+bandH+'px;background:rgba('+rgb+','+upperAlpha+')"></div>';
      html+='<div class="dynasty-band dynasty-band-lower" style="left:'+x1+'px;width:'+w+'px;top:'+centerY+'px;height:'+bandH+'px;background:rgba('+rgb+','+lowerAlpha+')"></div>';
      const divOpacity = isFocus ? 0.6 : 0.15 * bandOpacity;
      html+='<div class="dynasty-divider" style="left:'+x1+'px;top:'+(centerY-bandH)+'px;height:'+(bandH*2)+'px;background:rgba('+rgb+','+divOpacity+')"></div>';
      // Label above main band
      if(zl<=2 || isFocus){
        const cx=(x1+x2)/2;
        if(cx>-80&&cx<vw+80){
          const labelOpacity = isFocus ? 1 : 0.2 + bandOpacity * 0.3;
          const labelClass = isFocus ? 'dynasty-label focus' : 'dynasty-label';
          const labelTop = isFocus ? (centerY - bandH - 28) : (centerY - bandH + 6);
          const yearRange = formatDynastyYears(d);
          html+='<div class="'+labelClass+'" style="left:'+cx+'px;top:'+labelTop+'px;opacity:'+labelOpacity+'"><span>'+d.name+'</span><span class="dynasty-years">'+yearRange+'</span></div>';
        }
      }
    } else {
      // Staggered row (overlapping dynasty): draw as narrow strip with slanted edges
      const isAbove = (row % 2 === 1);
      const rowOffset = Math.ceil(row / 2);
      let rowY;
      if (isAbove) {
        rowY = centerY - bandH - rowOffset * (rowH + 3);
      } else {
        rowY = centerY + bandH + (rowOffset - 1) * (rowH + 3);
      }
      const rowAlpha = isFocus ? 0.4 : 0.1 * bandOpacity;
      // Center rectangle
      const slantPx = Math.min(w * 0.06, 10);
      html+='<div style="position:absolute;left:'+(x1+slantPx)+'px;width:'+Math.max(w-slantPx*2, 1)+'px;top:'+rowY+'px;height:'+rowH+'px;background:rgba('+rgb+','+rowAlpha+');border-radius:1px;pointer-events:none"></div>';
      // Left slant triangle
      if(x1 > -50) {
        html+='<div style="position:absolute;left:'+x1+'px;top:'+rowY+'px;width:0;height:0;border-top:'+(rowH/2)+'px solid transparent;border-bottom:'+(rowH/2)+'px solid transparent;border-right:'+slantPx+'px solid rgba('+rgb+','+rowAlpha+');pointer-events:none"></div>';
      }
      // Right slant triangle
      if(x2 < vw+50) {
        html+='<div style="position:absolute;left:'+(x2-slantPx)+'px;top:'+rowY+'px;width:0;height:0;border-top:'+(rowH/2)+'px solid transparent;border-bottom:'+(rowH/2)+'px solid transparent;border-left:'+slantPx+'px solid rgba('+rgb+','+rowAlpha+');pointer-events:none"></div>';
      }
      // Divider at start
      const divOpacity2 = isFocus ? 0.5 : 0.1 * bandOpacity;
      html+='<div class="dynasty-divider" style="left:'+x1+'px;top:'+rowY+'px;height:'+rowH+'px;background:rgba('+rgb+','+divOpacity2+')"></div>';
      // Label below/above the row strip
      const cx=(x1+x2)/2;
      if(cx>-80&&cx<vw+80) {
        const labelOpacity = isFocus ? 1 : 0.3 + bandOpacity * 0.3;
        const labelClass = isFocus ? 'dynasty-row-label focus' : 'dynasty-row-label';
        const yearRange = formatDynastyYears(d);
        const labelY = isAbove ? (rowY + rowH + 1) : (rowY - 12);
        html+='<div class="'+labelClass+'" style="left:'+cx+'px;top:'+labelY+'px;opacity:'+labelOpacity+';transform:translateX(-50%);text-align:center"><span style="display:block">'+d.name+'</span><span style="display:block;font-size:7px;opacity:0.6;letter-spacing:0">'+yearRange+'</span></div>';
      }
    }
  });

  // --- Population Curve (below timeline) ---
  const yr=visE-visS; // also used by ticks below
  if (showPopCurve) {
  // Render as SVG path below the center line
  const popBandH = bandH; // same height as dynasty bands
  const popBaseY = centerY + 4; // start just below the line
  const popMaxH = popBandH - 8; // max curve height

  // Sample visible range at reasonable intervals
  const popStep = yr > 2000 ? 50 : yr > 500 ? 20 : yr > 100 ? 10 : 5;
  const popStart = Math.max(Math.floor(visS / popStep) * popStep, -2000);
  const popEnd = Math.min(Math.ceil(visE / popStep) * popStep, 2025);
  let popPath = '';
  let popAreaPath = '';
  let first = true;

  for (let y = popStart; y <= popEnd; y += popStep) {
    const x = yearToX(y);
    const pop = getPopAtYear(y);
    const h = (pop / POP_MAX) * popMaxH;
    const py = popBaseY + popBandH - 4 - h;
    if (first) { popPath += 'M' + x + ' ' + py; popAreaPath += 'M' + x + ' ' + (popBaseY + popBandH - 4) + 'L' + x + ' ' + py; first = false; }
    else { popPath += 'L' + x + ' ' + py; popAreaPath += 'L' + x + ' ' + py; }
  }
  // Close area path
  popAreaPath += 'L' + yearToX(popEnd) + ' ' + (popBaseY + popBandH - 4) + 'Z';

  // Focus dynasty affects pop curve opacity
  const popCurveOpacity = 0.3;
  const popAreaOpacity = 0.04;

  if (popPath) {
    html += '<svg class="pop-curve-svg" viewBox="0 0 ' + vw + ' ' + vh + '">';
    html += '<path class="pop-curve-area" d="' + popAreaPath + '" fill="rgba(201,169,110,' + popAreaOpacity + ')" style="opacity:' + popAreaOpacity * 8 + '"/>';
    html += '<path class="pop-curve" d="' + popPath + '" style="opacity:' + popCurveOpacity + '"/>';

    // Current year population dot
    const centerPop = getPopAtYear(Math.round(centerYear));
    const centerPopH = (centerPop / POP_MAX) * popMaxH;
    const centerPopY = popBaseY + popBandH - 4 - centerPopH;
    const centerPopX = yearToX(centerYear);
    if (centerPopX > -20 && centerPopX < vw + 20) {
      html += '<circle class="pop-dot-glow" cx="' + centerPopX + '" cy="' + centerPopY + '" r="8"/>';
      html += '<circle class="pop-dot" cx="' + centerPopX + '" cy="' + centerPopY + '" r="3.5"/>';
      html += '<text class="pop-label" x="' + (centerPopX + 8) + '" y="' + (centerPopY + 3) + '">' + (centerPop >= 10000 ? (centerPop / 10000).toFixed(1) + '亿' : centerPop >= 1000 ? Math.round(centerPop / 1000) + '千万' : Math.round(centerPop) + '万') + '</text>';
    }

    html += '</svg>';
  }
  } // end showPopCurve

  // --- Background: ticks ---
  let ti;
  if(yr>4000)ti=500;else if(yr>1500)ti=200;else if(yr>600)ti=100;else if(yr>200)ti=50;else if(yr>80)ti=20;else if(yr>30)ti=10;else if(yr>10)ti=5;else ti=1;
  const ft=Math.max(Math.floor(visS/ti)*ti,DATA_MIN), lt=Math.min(visE+ti,DATA_MAX);
  for(let y=ft;y<=lt;y+=ti){
    const x=yearToX(y);if(x<-30||x>vw+30)continue;
    const isMaj=ti>=200||y%(ti*5)===0, tH=isMaj?16:6;
    html+='<div class="tick '+(isMaj?'major':'minor')+'" style="left:'+x+'px;top:'+centerY+'px"><div class="tick-line" style="height:'+tH+'px;top:'+(-tH/2)+'px;background:rgba(201,169,110,'+(isMaj?0.25:0.06)+')"></div>';
    if(isMaj||ti<=20) html+='<div class="tick-label" style="top:'+(tH/2+3)+'px;left:0">'+formatYear(y)+'</div>';
    html+='</div>';
  }

  // --- Events with focus-weighted density ---
  const visible=selectVisibleEvents(visS-50, visE+50, vw, centerYear);
  const items=visible.map(e=>({event:e, idx:eventIndex.get(e), x:yearToX(e.year), level:e.level, weight:calculateFocusWeight(e.year, centerYear)}));
  const laid=layoutCards(items,vh,vw);

  const newVisible=new Map();
  laid.forEach(item=>{newVisible.set(item.idx, item)});

  // Remove nodes no longer visible
  for(const [idx, node] of activeNodes){
    if(!newVisible.has(idx)){
      if(node.parentNode) node.parentNode.removeChild(node);
      activeNodes.delete(idx);
      returnPoolNode(node);
    }
  }

  // Add/update visible nodes
  for(const [idx, layout] of newVisible){
    const e=layout.event, x=layout.x, pos=layout.pos, stem=layout.stem, weight=layout.weight;
    const cc=getCatColor(e.category), css=getCatCSS(e.category);
    const yr2=formatYearFull(e);
    const isExp=expandedCard===idx;

    let node=activeNodes.get(idx);
    if(!node){
      node=getPoolNode();node.dataset.idx=idx;canvas.appendChild(node);activeNodes.set(idx, node);
    }

    // Position via CSS transform
    node.style.transform='translate('+x+'px,'+centerY+'px)';
    node.style.left='0';node.style.top='0';

    // Apply focus weight to opacity
    node.style.opacity = weight;

    if(isExp) node.classList.add('active');
    else node.classList.remove('active');

    // Dot
    const dot=node.querySelector('.event-dot');
    dot.className='event-dot level-'+e.level;
    dot.style.background=cc;dot.style.color=cc;

    // Stem
    const stemEl=node.querySelector('.event-stem');
    stemEl.className='event-stem '+pos;
    stemEl.style.height=stem+'px';stemEl.style.background=cc;

    // Card
    const card=node.querySelector('.event-card');
    card.className='event-card '+pos+' '+css+' '+(e.level===1?'important':'')+(isExp?' expanded':'');
    card.style.cssText=pos==='above'?'bottom:'+(4+stem)+'px':'top:'+(4+stem)+'px';

    card.querySelector('.event-year').textContent=yr2;
    card.querySelector('.event-title').textContent=e.title;
    const catTag=card.querySelector('.event-cat-tag');
    catTag.textContent=e.category;catTag.style.color=cc;catTag.style.background=cc+'15';
    const dynEl=card.querySelector('.event-dynasty');
    if(zl>=2||weight>=0.65){dynEl.textContent=e.dynasty;dynEl.style.display=''}
    else{dynEl.style.display='none'}
    const sumEl=card.querySelector('.event-summary');
    const detBtn=card.querySelector('.event-detail-btn');
    if(isExp){sumEl.textContent=e.summary;sumEl.style.display='block';detBtn.style.color=cc;detBtn.style.display='block'}
    else{sumEl.style.display='none';detBtn.style.display='none'}
  }

  // Insert background HTML
  const bgContainer=document.createElement('div');
  bgContainer.innerHTML=html;
  const toRemove=[];
  for(const child of canvas.children){if(!child.classList.contains('event-node'))toRemove.push(child)}
  toRemove.forEach(el=>canvas.removeChild(el));
  const firstNode=canvas.querySelector('.event-node');
  if(firstNode){while(bgContainer.firstChild)canvas.insertBefore(bgContainer.firstChild,firstNode)}
  else{while(bgContainer.firstChild)canvas.appendChild(bgContainer.firstChild)}

  updateScaleBar();
}

// ============ Scale Bar ============
function updateScaleBar(){
  const vw=viewport.clientWidth, targetPx=Math.min(100,vw*0.18);
  const rawYears=(vw/pixelsPerYear)*(targetPx/vw);
  const nice=[1,2,5,10,20,50,100,200,500,1000,2000,5000];
  let step=nice.find(s=>s>=rawYears)||5000;
  scaleLine.style.width=(step*pixelsPerYear)+'px';
  scaleLabel.textContent=step>=1000?(step/1000)+'千年':step+'年';
}

let searchTimeout;
searchInput.addEventListener('input',()=>{clearTimeout(searchTimeout);searchTimeout=setTimeout(doSearch,200)});
searchInput.addEventListener('focus',()=>{if(searchInput.value.trim())doSearch()});
function doSearch(){
  const q=searchInput.value.trim().toLowerCase();if(!q){searchResults.classList.remove('active');return}
  const m=events.filter(e=>e.title.toLowerCase().includes(q)||e.summary.toLowerCase().includes(q)||e.detail.toLowerCase().includes(q)||e.dynasty.toLowerCase().includes(q)||e.category.includes(q)).slice(0,15);
  if(!m.length){searchResults.innerHTML='<div class="search-item"><span style="color:var(--text-muted)">未找到相关事件</span></div>'}
  else{searchResults.innerHTML=m.map(e=>{const i=eventIndex.get(e),cc=getCatColor(e.category);return'<div class="search-item" onclick="jumpToEvent('+i+')"><span class="si-year">'+formatYearFull(e)+'</span><span class="si-title">'+e.title+'</span><span class="si-cat" style="color:'+cc+';background:'+cc+'15">'+e.category+'</span></div>'}).join('')}
  searchResults.classList.add('active');
}
function jumpToEvent(idx){const e=events[idx],vw=viewport.clientWidth;offsetX=vw/2-e.year*pixelsPerYear;clampOffsetX();expandedCard=idx;searchResults.classList.remove('active');searchInput.value='';searchInput.blur();requestRender()}

// ============ Navigation ============
function goHome(){
  const centerYear=(DATA_MIN+DATA_MAX)/2;
  offsetX=viewport.clientWidth/2-centerYear*pixelsPerYear;clampOffsetX();
  expandedCard=null;requestRender();
}
function animateTo(ty,tppy){
  const vw=viewport.clientWidth,so=offsetX,sp=pixelsPerYear,eo=vw/2-ty*tppy,ep=tppy,dur=400,st=performance.now();
  isAnimating=true;
  function step(now){
    const t=Math.min((now-st)/dur,1),ease=1-Math.pow(1-t,3);
    pixelsPerYear=sp+(ep-sp)*ease;offsetX=so+(eo-so)*ease;
    requestRender();if(t<1)requestAnimationFrame(step);else isAnimating=false;
  }
  requestAnimationFrame(step);
}

// ============ Touch ============
let dragStartX=0, dragStartOffsetX=0, touchMoved=false, touchStartTime=0;
let lastPointerX=0, lastTime=0;
let pinchStartDist=0, pinchStartPPY=0, pinchCenterX=0, pinchCenterYear=0;

viewport.addEventListener('touchstart',e=>{
  const now=Date.now();
  if(e.touches.length===1){
    if(now-lastPinchTime<PINCH_COOLDOWN){e.preventDefault();return}
    touchState='dragging';touchMoved=false;touchStartTime=now;
    dragStartX=e.touches[0].clientX;dragStartOffsetX=offsetX;
    velocity=0;lastPointerX=e.touches[0].clientX;lastTime=now;
    manualFocusDynasty=null; // user started dragging, release manual focus
  }
  else if(e.touches.length===2){
    touchState='pinching';pinchConfirmed=false;
    const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
    pinchStartDist=Math.sqrt(dx*dx+dy*dy);pinchCurrentDist=pinchStartDist;
    pinchStartPPY=pixelsPerYear;
    pinchCenterX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    pinchCenterYear=xToYear(pinchCenterX);
  }
  e.preventDefault();
},{passive:false});

viewport.addEventListener('touchmove',e=>{
  if(touchState==='dragging'&&e.touches.length===1){
    const dx=e.touches[0].clientX-dragStartX;
    if(Math.abs(dx)>5)touchMoved=true;
    offsetX=dragStartOffsetX+dx;clampOffsetX();
    const now=Date.now(),dt=now-lastTime;
    if(dt>0)velocity=(e.touches[0].clientX-lastPointerX)/dt*16;
    lastPointerX=e.touches[0].clientX;lastTime=now;
    requestRender();
  }
  else if(touchState==='pinching'&&e.touches.length===2){
    const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
    pinchCurrentDist=Math.sqrt(dx*dx+dy*dy);
    if(!pinchConfirmed&&Math.abs(pinchCurrentDist-pinchStartDist)<PINCH_DEADZONE){e.preventDefault();return}
    pinchConfirmed=true;
    if(pinchStartDist>0){
      let np=pinchStartPPY*(pinchCurrentDist/pinchStartDist);
      np=Math.max(0.01,Math.min(30,np));pixelsPerYear=np;
      offsetX=pinchCenterX-pinchCenterYear*pixelsPerYear;clampOffsetX();
    }
    requestRender();showZI();
  }
  else if(touchState==='dragging'&&e.touches.length===2){
    touchState='pinching';pinchConfirmed=false;
    const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
    pinchStartDist=Math.sqrt(dx*dx+dy*dy);pinchCurrentDist=pinchStartDist;
    pinchStartPPY=pixelsPerYear;
    pinchCenterX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    pinchCenterYear=xToYear(pinchCenterX);
  }
  e.preventDefault();
},{passive:false});

viewport.addEventListener('touchend',e=>{
  if(touchState==='pinching'){
    lastPinchTime=Date.now();
    if(e.touches.length===1&&!pinchConfirmed){
      touchState='dragging';dragStartX=e.touches[0].clientX;dragStartOffsetX=offsetX;
      lastPointerX=e.touches[0].clientX;lastTime=Date.now();
    }else{touchState='idle'}
  }
  else if(touchState==='dragging'){
    if(e.touches.length===0){
      if(!touchMoved){
        const touch=e.changedTouches[0];
        const node=document.elementFromPoint(touch.clientX,touch.clientY);
        const eventNode=node?node.closest('.event-node'):null;
        if(eventNode){
          const idx=parseInt(eventNode.dataset.idx);
          if(expandedCard===idx) showDetail(idx);else{expandedCard=idx;requestRender()}
        }else if(expandedCard!==null&&!node?.closest('.event-card')&&!node?.closest('.event-node')){
          expandedCard=null;requestRender();
        }
      }else{requestAnimationFrame(inertia)}
      touchState='idle';
    }
  }
});

function inertia(){
  if(Math.abs(velocity)>0.3){offsetX+=velocity;velocity*=0.93;const prev=offsetX;clampOffsetX();if(offsetX!==prev)velocity=0;requestRender();requestAnimationFrame(inertia)}
}

// ============ Mouse ============
let mDown=false, mSX=0, mSO=0;
viewport.addEventListener('mousedown',e=>{
  if(e.target.closest('.event-card,.btn,.filter-chip,.density-control,.dynasty-nav,.side-btn'))return;
  mDown=true;mSX=e.clientX;mSO=offsetX;velocity=0;lastPointerX=e.clientX;lastTime=Date.now();
  manualFocusDynasty=null; // user started dragging, release manual focus
});
viewport.addEventListener('mousemove',e=>{
  if(!mDown)return;offsetX=mSO+(e.clientX-mSX);clampOffsetX();
  const now=Date.now(),dt=now-lastTime;
  if(dt>0)velocity=(e.clientX-lastPointerX)/dt*16;
  lastPointerX=e.clientX;lastTime=now;requestRender();
});
viewport.addEventListener('mouseup',()=>{mDown=false;requestAnimationFrame(inertia)});
viewport.addEventListener('mouseleave',()=>{mDown=false});

// ============ Wheel ============
viewport.addEventListener('wheel',e=>{
  e.preventDefault();const r=viewport.getBoundingClientRect(),mx=e.clientX-r.left,my=xToYear(mx);
  let np=pixelsPerYear*(e.deltaY>0?0.9:1.11);np=Math.max(0.01,Math.min(30,np));
  pixelsPerYear=np;offsetX=mx-my*pixelsPerYear;clampOffsetX();
  manualFocusDynasty=null; // user is scrolling, release manual focus
  requestRender();showZI();
},{passive:false});

// ============ Keyboard ============
document.addEventListener('keydown',e=>{
  const step=viewport.clientWidth*0.3;
  if(e.key==='ArrowLeft'){offsetX+=step;requestRender()}
  if(e.key==='ArrowRight'){offsetX-=step;requestRender()}
  if(e.key==='+'||e.key==='='){const cx=viewport.clientWidth/2,cy=xToYear(cx);pixelsPerYear=Math.min(30,pixelsPerYear*1.2);offsetX=cx-cy*pixelsPerYear;requestRender();showZI()}
  if(e.key==='-'){const cx=viewport.clientWidth/2,cy=xToYear(cx);pixelsPerYear=Math.max(0.01,pixelsPerYear/1.2);offsetX=cx-cy*pixelsPerYear;requestRender();showZI()}
  if(e.key==='Escape'){closeDetail();closeFeedback()}
  if(e.key==='Home'||e.key==='h')goHome();
});

// ============ Feedback ============
const feedbackBtn=document.getElementById('feedbackBtn');
const feedbackOverlay=document.getElementById('feedbackOverlay');
const feedbackClose=document.getElementById('feedbackClose');
const feedbackForm=document.getElementById('feedbackForm');
const feedbackSuccess=document.getElementById('feedbackSuccess');
const feedbackSubmit=document.getElementById('feedbackSubmit');
const feedbackText=document.getElementById('feedbackText');
const feedbackContact=document.getElementById('feedbackContact');

feedbackBtn.addEventListener('click',()=>{feedbackOverlay.classList.add('active')});
feedbackClose.addEventListener('click',closeFeedback);
feedbackOverlay.addEventListener('click',e=>{if(e.target===feedbackOverlay)closeFeedback()});

function closeFeedback(){
  feedbackOverlay.classList.remove('active');
  setTimeout(()=>{feedbackForm.style.display='';feedbackSuccess.style.display='none';feedbackText.value='';feedbackContact.value='';feedbackSubmit.disabled=false},300);
}

feedbackSubmit.addEventListener('click',()=>{
  const text=feedbackText.value.trim();if(!text)return;
  const contact=feedbackContact.value.trim();
  const ua=navigator.userAgent;const isMobile=/Mobi|Android|iPhone/i.test(ua);
  const time=new Date().toLocaleString('zh-CN');
  const title='[反馈] '+text.slice(0,60);
  const body='## 用户反馈\n\n'+text+'\n\n---\n- **联系方式**: '+(contact||'未提供')+'\n- **设备**: '+(isMobile?'移动端':'桌面端')+'\n- **时间**: '+time;
  const issueUrl='https://github.com/O-kai/china-history-timeline/issues/new?labels=feedback&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
  window.open(issueUrl,'_blank');
  feedbackForm.style.display='none';feedbackSuccess.style.display='block';
});
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>console.log('SW registered:',r.scope)).catch(e=>console.warn('SW failed:',e))}

// Share button
const shareBtn=document.getElementById('shareBtn');
shareBtn.addEventListener('click',async()=>{
  const shareData={title:'中华历史时间轴',text:'纵览五千年文明脉络——可交互中华历史时间轴',url:location.href};
  if(navigator.share){try{await navigator.share(shareData)}catch(e){if(e.name!=='AbortError')copyUrl()}}else{copyUrl()}
});
function copyUrl(){
  navigator.clipboard.writeText(location.href).then(()=>showToast('链接已复制，可分享给朋友')).catch(()=>showToast('请手动复制地址栏链接'));
}
function showToast(msg){
  const t=document.createElement('div');t.textContent=msg;
  Object.assign(t.style,{position:'fixed',bottom:'50%',left:'50%',transform:'translate(-50%,-50%)',background:'rgba(10,10,20,0.95)',border:'1px solid var(--border-gold)',borderRadius:'10px',padding:'12px 24px',color:'var(--gold)',fontSize:'14px',zIndex:'999',pointerEvents:'none',animation:'fadeOut 2s forwards'});
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}
// Add fadeOut animation
if(!document.getElementById('toast-style')){const s=document.createElement('style');s.id='toast-style';s.textContent='@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}';document.head.appendChild(s)}

// PWA install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
// Show install tip after 3s on mobile
setTimeout(()=>{
  if(!window.matchMedia('(display-mode:standalone)').matches&&/Mobi|Android|iPhone/i.test(navigator.userAgent)){
    const tip=document.createElement('div');
    tip.innerHTML='<div style="font-size:13px;color:var(--gold);margin-bottom:6px">📲 添加到主屏幕，像App一样使用</div><div style="font-size:11px;color:var(--text-secondary);line-height:1.5">'+(/iPhone|iPad/i.test(navigator.userAgent)?'点击底部 <b style="color:var(--gold)">分享按钮</b> → 选择「添加到主屏幕」':'点击右上角 <b style="color:var(--gold)">⋮</b> → 选择「添加到主屏幕」')+'</div>';
    Object.assign(tip.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'rgba(10,10,20,0.96)',border:'1px solid var(--border-gold)',borderRadius:'12px',padding:'14px 20px',zIndex:'200',maxWidth:'320px',width:'85%',boxShadow:'0 4px 20px rgba(201,169,110,0.12)',animation:'fadeOut 8s forwards'});
    document.body.appendChild(tip);setTimeout(()=>tip.remove(),8500);
  }
},3000);
</script>
